[project]
name = "flow-worktrees"
version = "0.1.0"
description = "One git worktree per task for humans and AI agents; stage and ball derived from GitLab; a journal that writes itself."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]
keywords = ["git", "worktree", "gitlab", "claude-code", "task-tracking"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Repository = "https://github.com/danielPashht/flow-worktrees"

[project.scripts]
flow = "flow_worktrees.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_worktrees"]

[tool.pytest.ini_options]
testpaths = ["tests"]
